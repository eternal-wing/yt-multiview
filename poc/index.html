<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YT Multiview Sync PoC</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e8eaf0; --muted: #9aa3b2;
    --accent: #ff4d4d; --ok: #3ecf8e; --warn: #f5b942;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  header, section { padding: 12px 16px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .notice { background: #2a2210; border: 1px solid #5a4716; color: #f3d9a0; padding: 8px 10px; border-radius: 8px; margin: 8px 0; font-size: 13px; }
  .hidden { display: none !important; }
  textarea, input[type=text], input[type=password], input[type=number] {
    width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit;
  }
  textarea { min-height: 84px; }
  label.row { display: block; margin: 8px 0; color: var(--muted); }
  button { background: #262b36; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; touch-action: manipulation; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #transport { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  #seek { flex: 1 1 200px; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); }
  #grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 12px 16px 40px; }
  @media (min-width: 900px) { #grid.n2, #grid.n3, #grid.n4 { grid-template-columns: 1fr 1fr; } }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tile.master { border-color: var(--accent); }
  .video { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .video > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ctl { padding: 8px 10px; display: grid; gap: 6px; }
  .ctl .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { flex: 1 1 120px; }
  .ctl input[type=number] { width: 90px; padding: 4px 6px; }
  .ctl button { padding: 4px 8px; }
  .drift.ok { color: var(--ok); } .drift.bad { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>YouTube 멀티뷰 싱크 PoC</h1>
  <div id="iosNotice" class="notice hidden">
    iPhone/iPad 감지: iOS는 웹 페이지가 영상 볼륨을 조절하는 것을 허용하지 않습니다. 볼륨 슬라이더 대신 <b>음소거 / 솔로</b> 버튼으로 들을 방송을 선택하세요.
    첫 재생은 반드시 아래 <b>전체 재생</b> 버튼을 탭해야 합니다.
  </div>
</header>

<section id="setup">
  <label class="row">방송 URL 또는 영상 ID (한 줄에 하나, 2~4개)
    <textarea id="urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/..."></textarea>
  </label>
  <label class="row">YouTube Data API 키 (선택 — 입력하면 방송 시작시각으로 자동 싱크)
    <input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
  </label>
  <div class="bar">
    <button id="loadBtn" class="primary">불러오기</button>
    <span id="setupMsg" class="time"></span>
  </div>
</section>

<section id="transport" class="hidden">
  <div class="bar">
    <button id="playAll" class="primary">▶ 전체 재생</button>
    <button id="pauseAll">⏸ 전체 정지</button>
    <button data-jump="-10">−10s</button>
    <button data-jump="10">+10s</button>
    <button id="resync">재정렬</button>
    <input id="seek" type="range" min="0" max="0" step="1" value="0">
    <span id="clock" class="time">0:00:00 / 0:00:00</span>
    <button id="shareBtn">링크 복사</button>
  </div>
</section>

<div id="grid"></div>

<template id="tileTpl">
  <div class="tile">
    <div class="video"><div class="player"></div></div>
    <div class="ctl">
      <div class="title">로딩 중…</div>
      <div class="bar">
        <label><input type="radio" name="master" class="masterRadio"> 기준</label>
        <button class="muteBtn">🔊</button>
        <button class="soloBtn">솔로</button>
        <input type="range" class="vol" min="0" max="100" value="100" aria-label="볼륨">
      </div>
      <div class="bar">
        <span class="time">보정</span>
        <button data-nudge="-1">−1s</button>
        <button data-nudge="-0.1">−0.1</button>
        <input type="number" class="manual" step="0.1" value="0" aria-label="수동 보정(초)">
        <button data-nudge="0.1">+0.1</button>
        <button data-nudge="1">+1s</button>
      </div>
      <div class="meta"></div>
    </div>
  </div>
</template>

<script>
'use strict';

// ---- 설정값 ----
const SYNC_INTERVAL_MS = 500;   // 드리프트 검사 주기
const DRIFT_SEEK_SEC   = 0.35;  // 이 이상 벌어지면 seekTo로 강제 정렬
const SEEK_COOLDOWN_MS = 1500;  // seek 직후 재검사 유예 (버퍼링 중 반복 seek 방지)

const YT_STATE = { UNSTARTED: -1, ENDED: 0, PLAYING: 1, PAUSED: 2, BUFFERING: 3, CUED: 5 };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const $ = (s, r = document) => r.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

/**
 * 동기화 모델
 *  각 방송 i 는 "실제 시각" 축 위의 시작점 start_i(초, epoch)를 가진다.
 *  공통 타임라인 G(= 실제 시각) 에서 방송 i 가 있어야 할 위치:
 *      pos_i = G - start_i + manual_i
 *  manual_i > 0 이면 그 방송을 앞쪽(나중 장면)으로 당긴다.
 *  G 는 기준(master) 방송의 현재 위치로부터 역산한다.
 */
const streams = [];      // { id, start, manual, player, ready, tile, title, lastSeek, muted }
let masterIdx = 0;
let playing = false;     // 사용자가 의도한 전체 재생 상태
let syncTimer = null;
let seekDragging = false;

if (isIOS) $('#iosNotice').classList.remove('hidden');
$('#apiKey').value = store.get('ytmv.apiKey') || '';

// ---- URL 파싱 ----
function parseVideoId(s) {
  s = s.trim();
  if (!s) return null;
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s);
    if (u.hostname.endsWith('youtu.be')) return u.pathname.slice(1, 12) || null;
    if (u.searchParams.get('v')) return u.searchParams.get('v');
    const m = u.pathname.match(/\/(?:live|embed|shorts|v)\/([\w-]{11})/);
    return m ? m[1] : null;
  } catch { return null; }
}

// ---- 공유 링크(#v=id1,id2&o=0,1.5&m=0) ----
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const ids = (p.get('v') || '').split(',').filter(Boolean);
  if (!ids.length) return;
  $('#urls').value = ids.join('\n');
  const offs = (p.get('o') || '').split(',').map(Number);
  return { ids, offs, master: Number(p.get('m')) || 0 };
}
function writeHash() {
  const v = streams.map(s => s.id).join(',');
  const o = streams.map(s => +s.manual.toFixed(2)).join(',');
  history.replaceState(null, '', `#v=${v}&o=${o}&m=${masterIdx}`);
}

// ---- 방송 시작시각 조회 (YouTube Data API v3) ----
async function fetchStartTimes(ids, key) {
  const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${ids.join(',')}&key=${encodeURIComponent(key)}`;
  const res = await fetch(url);
  const json = await res.json();
  if (!res.ok) throw new Error(json.error?.message || res.status);
  const map = {};
  for (const item of json.items || []) {
    const d = item.liveStreamingDetails || {};
    const t = d.actualStartTime || d.scheduledStartTime;
    map[item.id] = { title: item.snippet?.title, start: t ? Date.parse(t) / 1000 : null };
  }
  return map;
}

// ---- IFrame API 로드 ----
let ytReady = new Promise(resolve => { window.onYouTubeIframeAPIReady = resolve; });
function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (!document.getElementById('yt-api')) {
    const s = document.createElement('script');
    s.id = 'yt-api';
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
  return ytReady;
}

// ---- 초기화 ----
$('#loadBtn').onclick = () => setup();

async function setup(initial) {
  const ids = $('#urls').value.split('\n').map(parseVideoId).filter(Boolean);
  const msg = $('#setupMsg');
  if (ids.length < 1 || ids.length > 4) { msg.textContent = '1~4개의 유효한 URL/ID를 입력하세요.'; return; }

  const key = $('#apiKey').value.trim();
  store.set('ytmv.apiKey', key);
  let meta = {};
  if (key) {
    msg.textContent = '방송 시작시각 조회 중…';
    try { meta = await fetchStartTimes(ids, key); }
    catch (e) { msg.textContent = `API 조회 실패(${e.message}) — 수동 보정으로 진행합니다.`; }
  }

  teardown();
  const offs = initial?.offs || [];
  masterIdx = Math.min(initial?.master || 0, ids.length - 1);
  ids.forEach((id, i) => {
    const m = meta[id] || {};
    streams.push({ id, start: m.start ?? 0, hasStart: m.start != null, manual: Number.isFinite(offs[i]) ? offs[i] : 0,
                   title: m.title || id, player: null, ready: false, lastSeek: 0, muted: false, tile: null });
  });
  const missing = streams.filter(s => !s.hasStart).length;
  if (key && missing && missing < streams.length) {
    // 일부만 시작시각이 있으면 없는 것은 기준 방송과 같은 시각으로 가정
    const ref = streams.find(s => s.hasStart).start;
    streams.forEach(s => { if (!s.hasStart) s.start = ref; });
  }
  if (!msg.textContent.startsWith('API 조회 실패')) {
    msg.textContent = key ? (missing ? `${missing}개 방송은 시작시각 정보가 없어 수동 보정이 필요합니다.` : '시작시각 기준 자동 싱크 적용됨.')
                          : 'API 키 없음 — 수동 보정으로 싱크를 맞추세요.';
  }

  await loadYT();
  const grid = $('#grid');
  grid.className = 'n' + streams.length;
  streams.forEach((s, i) => buildTile(s, i, grid));
  $('#transport').classList.remove('hidden');
  writeHash();
}

function teardown() {
  clearInterval(syncTimer); syncTimer = null;
  playing = false;
  streams.forEach(s => { try { s.player?.destroy(); } catch {} });
  streams.length = 0;
  $('#grid').innerHTML = '';
}

function buildTile(s, i, grid) {
  const tile = $('#tileTpl').content.firstElementChild.cloneNode(true);
  s.tile = tile;
  grid.appendChild(tile);
  $('.title', tile).textContent = s.title;
  $('.manual', tile).value = s.manual;
  const radio = $('.masterRadio', tile);
  radio.checked = i === masterIdx;
  radio.onchange = () => { masterIdx = i; renderMaster(); writeHash(); };

  const vol = $('.vol', tile);
  if (isIOS) { vol.disabled = true; vol.title = 'iOS에서는 개별 볼륨 조절 불가'; }
  vol.oninput = () => s.ready && s.player.setVolume(+vol.value);
  $('.muteBtn', tile).onclick = () => setMuted(s, !s.muted);
  $('.soloBtn', tile).onclick = () => streams.forEach(o => setMuted(o, o !== s));

  $('.manual', tile).onchange = e => { s.manual = +e.target.value || 0; afterManualChange(); };
  tile.querySelectorAll('[data-nudge]').forEach(b => b.onclick = () => {
    s.manual = Math.round((s.manual + +b.dataset.nudge) * 100) / 100;
    $('.manual', tile).value = s.manual;
    afterManualChange();
  });

  s.player = new YT.Player($('.player', tile), {
    videoId: s.id,
    playerVars: { playsinline: 1, rel: 0, controls: 1, origin: location.origin },
    events: {
      onReady: () => { s.ready = true; if (streams.every(x => x.ready)) onAllReady(); },
      onStateChange: e => onStateChange(s, e.data),
      onError: e => { $('.meta', tile).textContent = `재생 오류 ${e.data} (임베드 금지/비공개 영상일 수 있음)`; },
    },
  });
  renderMaster();
}

function onAllReady() {
  // 정렬은 첫 '전체 재생' 시점에 수행 (cued 상태에서 seekTo 하면 자동재생이 시도되므로)
  syncTimer = setInterval(tick, SYNC_INTERVAL_MS);
}

function setMuted(s, muted) {
  s.muted = muted;
  if (s.ready) muted ? s.player.mute() : s.player.unMute();
  $('.muteBtn', s.tile).textContent = muted ? '🔇' : '🔊';
}

function afterManualChange() { writeHash(); alignAll(currentG(), false); }

function renderMaster() {
  streams.forEach((s, i) => s.tile?.classList.toggle('master', i === masterIdx));
}

// ---- 타임라인 계산 ----
const master = () => streams[masterIdx];
const timelineAt = (s, pos) => pos + s.start - s.manual;          // 위치 -> G
const targetPos  = (s, G)   => G - s.start + s.manual;            // G -> 위치
const currentG   = () => timelineAt(master(), master().player.getCurrentTime() || 0);
const duration   = s => s.player.getDuration() || 0;

// 한 방송을 G 에 맞춰 이동. 아직 시작 전(pos<0)이면 0초에서 대기, 끝났으면 정지.
function place(s, G, shouldPlay) {
  const pos = targetPos(s, G);
  const dur = duration(s);
  if (pos < 0 || (dur && pos >= dur)) {
    s.player.seekTo(pos < 0 ? 0 : dur, true);
    s.player.pauseVideo();
    s.waiting = pos < 0;
    s.lastSeek = performance.now();
    return;
  }
  s.waiting = false;
  s.player.seekTo(pos, true);
  s.lastSeek = performance.now();
  if (shouldPlay) s.player.playVideo(); else s.player.pauseVideo();
}

// includeMaster=false: G 를 기준 방송 현재 위치에서 구했을 때 기준 방송은 다시 seek 하지 않음
function alignAll(G, includeMaster = true) {
  streams.forEach(s => s.ready && (includeMaster || s !== master()) && place(s, G, playing));
}

// ---- 전체 제어 ----
// iOS: playVideo 호출은 반드시 사용자 탭 핸들러 안에서 동기적으로 이뤄져야 함
$('#playAll').onclick = () => {
  playing = true;
  const G = currentG();
  streams.forEach(s => {
    const pos = targetPos(s, G);
    if (pos >= 0 && pos < (duration(s) || Infinity)) s.player.playVideo();
  });
  alignAll(G, false);
};
$('#pauseAll').onclick = () => { playing = false; streams.forEach(s => s.player.pauseVideo()); };
$('#resync').onclick = () => alignAll(currentG(), false);
document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => alignAll(currentG() + +b.dataset.jump));

const seek = $('#seek');
seek.oninput = () => { seekDragging = true; renderClock(+seek.value); };
seek.onchange = () => { seekDragging = false; alignAll(timelineAt(master(), +seek.value)); };

$('#shareBtn').onclick = async () => {
  writeHash();
  try { await navigator.clipboard.writeText(location.href); $('#shareBtn').textContent = '복사됨'; }
  catch { prompt('링크', location.href); }
  setTimeout(() => $('#shareBtn').textContent = '링크 복사', 1500);
};

// 기준 방송을 자체 컨트롤로 재생/정지하면 전체에 반영
function onStateChange(s, state) {
  if (s !== master()) return;
  if (state === YT_STATE.PLAYING && !playing) {
    playing = true; alignAll(currentG(), false);
  } else if (state === YT_STATE.PAUSED && playing) {
    playing = false; streams.forEach(o => o !== s && o.player.pauseVideo());
  }
}

// ---- 드리프트 보정 루프 ----
function tick() {
  if (!streams.length || !master().ready) return;
  const m = master();
  const G = currentG();
  const now = performance.now();
  const masterRunning = m.player.getPlayerState() === YT_STATE.PLAYING;

  streams.forEach(s => {
    if (!s.ready) return;
    const want = targetPos(s, G);
    const cur = s.player.getCurrentTime() || 0;
    const drift = cur - want;
    const st = s.player.getPlayerState();
    const meta = $('.meta', s.tile);
    const auto = s.start - m.start;
    meta.innerHTML = `위치 ${fmt(cur)} · 목표 ${fmt(Math.max(0, want))} · 오차 <span class="drift ${Math.abs(drift) < DRIFT_SEEK_SEC ? 'ok' : 'bad'}">${drift >= 0 ? '+' : ''}${drift.toFixed(2)}s</span>` +
                     ` · 자동오프셋 ${auto >= 0 ? '+' : ''}${auto.toFixed(1)}s` + (s.waiting ? ' · 시작 대기' : '');

    if (s === m || !playing || !masterRunning) return;
    if (now - s.lastSeek < SEEK_COOLDOWN_MS) return;
    // 늦게 시작하는 방송: 목표 위치가 0 이상이 되면 재생 시작
    if (s.waiting && want >= 0) { place(s, G, true); return; }
    if (want < 0 || s.waiting) return;
    if (duration(s) && want >= duration(s)) {           // 이 방송은 이미 끝난 구간
      if (st === YT_STATE.PLAYING) s.player.pauseVideo();
      return;
    }
    if (Math.abs(drift) > DRIFT_SEEK_SEC || st !== YT_STATE.PLAYING && st !== YT_STATE.BUFFERING) {
      place(s, G, true);
    }
  });

  if (!seekDragging) {
    seek.max = Math.floor(duration(m));
    seek.value = Math.floor(m.player.getCurrentTime() || 0);
    renderClock(+seek.value);
  }
}

function renderClock(pos) { $('#clock').textContent = `${fmt(pos)} / ${fmt(duration(master()))}`; }
function fmt(t) {
  t = Math.max(0, Math.floor(t));
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

const initial = readHash();
if (initial) setup(initial);
</script>
</body>
</html>
