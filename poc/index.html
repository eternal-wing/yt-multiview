<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>YT Multiview Sync PoC</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e8eaf0; --muted: #9aa3b2;
    --accent: #ff4d4d; --sel: #4d9bff; --ok: #3ecf8e; --warn: #f5b942;
    --label-h: 24px; --gap: 6px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  .hidden { display: none !important; }
  button {
    background: #262b36; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    min-width: 36px; height: 36px; padding: 0 8px; font: inherit; cursor: pointer; touch-action: manipulation;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.on { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; }
  input[type=range] { accent-color: var(--accent); }

  /* ---- 설정 패널: 처음엔 전체 화면, 불러온 뒤엔 영상 위에 덮는 오버레이 ---- */
  #setup { padding: 12px 16px; overflow-y: auto; flex: 1; }
  body.loaded #setup { position: fixed; inset: 0; z-index: 20; background: rgba(15, 17, 21, .97); }
  #setup h1 { font-size: 16px; margin: 0 0 8px; }
  #setup label { display: block; margin: 10px 0; color: var(--muted); }
  #setup textarea, #setup input {
    width: 100%; margin-top: 4px; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px; font-family: inherit; font-size: 16px; /* 16px: iOS 입력 시 자동 확대 방지 */
  }
  #setup textarea { min-height: 96px; }
  .notice { background: #2a2210; border: 1px solid #5a4716; color: #f3d9a0; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #setupMsg { color: var(--muted); }

  /* ---- 영상 영역: 열 수와 크기는 fitLayout()이 계산 ---- */
  #stage { flex: 1; min-height: 0; overflow: auto; padding: var(--gap); }
  #grid { display: grid; gap: var(--gap); justify-content: center; align-content: center; min-height: 100%; }
  .tile { background: var(--panel); border-radius: 6px; overflow: hidden; outline: 2px solid transparent; }
  .tile.sel { outline-color: var(--sel); }
  .video { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .video > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .label {
    height: var(--label-h); display: flex; align-items: center; gap: 6px; padding: 0 6px;
    font-size: 12px; cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .label .num { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--line); font-size: 11px; display: grid; place-items: center; }
  .tile.sel .label .num { background: var(--sel); color: #fff; }
  .label .star { color: var(--accent); flex: none; }
  .label .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .label .st { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  .st .ok { color: var(--ok); } .st .bad { color: var(--warn); }

  /* ---- 하단 도크 ---- */
  #dock {
    flex: none; border-top: 1px solid var(--line); background: var(--panel);
    padding: 4px 12px calc(6px + env(safe-area-inset-bottom)); display: grid; gap: 4px;
  }
  #dock { grid-template-columns: minmax(0, 1fr); }
  #dock .row { gap: 4px; flex-wrap: nowrap; min-width: 0; }
  #dock button { flex: 0 1 auto; min-width: 32px; padding: 0 6px; font-size: 14px; white-space: nowrap; }
  #seek { width: 100%; margin: 0; height: 24px; }
  #clock { flex: 1; min-width: 0; overflow: hidden; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #selNum { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--sel); color: #fff; font-size: 12px; display: grid; place-items: center; }
  #manual { flex: none; width: 50px; height: 36px; text-align: center; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-family: inherit; font-size: 16px; padding: 0 2px; }
  .spacer { flex: 1; }
  #vol { flex: 1; min-width: 0; }
</style>
</head>
<body>

<section id="setup">
  <h1>YouTube 멀티뷰 싱크 PoC</h1>
  <p id="iosNotice" class="notice hidden">
    iPhone/iPad에서는 웹 페이지가 영상 볼륨을 조절할 수 없어서, 볼륨 대신 <b>음소거 / 솔로</b> 버튼으로 들을 방송을 고릅니다.
    첫 재생은 반드시 하단의 <b>▶</b> 버튼을 탭하세요.
  </p>
  <label>방송 URL 또는 영상 ID (한 줄에 하나, 2~4개)
    <textarea id="urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/..."></textarea>
  </label>
  <label>YouTube Data API 키 (선택 — 입력하면 방송 시작시각으로 자동 싱크)
    <input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
  </label>
  <div class="row">
    <button id="loadBtn" class="primary">불러오기</button>
    <button id="closeSetup" class="hidden">닫기</button>
    <span id="setupMsg"></span>
  </div>
</section>

<main id="stage" class="hidden"><div id="grid"></div></main>

<footer id="dock" class="hidden">
  <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="기준 방송 위치">
  <div class="row">
    <button id="playPause" class="primary" aria-label="전체 재생/정지">▶</button>
    <button data-jump="-10">−10</button>
    <button data-jump="10">+10</button>
    <button id="resync" title="모든 방송을 다시 정렬">⟲</button>
    <span id="clock">0:00:00 / 0:00:00</span>
    <button id="shareBtn" title="링크 복사">🔗</button>
    <button id="openSetup" title="설정">⚙</button>
  </div>
  <div class="row" aria-label="선택한 방송 제어">
    <span id="selNum">1</span>
    <button id="masterBtn" title="기준 방송으로 지정">★</button>
    <button id="muteBtn" aria-label="음소거">🔊</button>
    <button id="soloBtn">솔로</button>
    <span class="spacer"></span>
    <button data-nudge="-1">−1</button>
    <button data-nudge="-0.1">−.1</button>
    <input id="manual" type="number" inputmode="decimal" step="0.1" value="0" aria-label="수동 보정(초)">
    <button data-nudge="0.1">+.1</button>
    <button data-nudge="1">+1</button>
  </div>
  <div id="volRow" class="row">
    <span>🔈</span><input id="vol" type="range" min="0" max="100" value="100" aria-label="선택한 방송 볼륨"><span id="volVal">100</span>
  </div>
</footer>

<template id="tileTpl">
  <div class="tile">
    <div class="video"><div class="player"></div></div>
    <div class="label"><span class="num"></span><span class="star hidden">★</span><span class="name"></span><span class="st"></span></div>
  </div>
</template>

<script>
'use strict';

// ---- 설정값 ----
const SYNC_INTERVAL_MS = 500;   // 드리프트 검사 주기
const DRIFT_SEEK_SEC   = 0.35;  // 이 이상 벌어지면 seekTo로 강제 정렬
const SEEK_COOLDOWN_MS = 1500;  // seek 직후 재검사 유예 (버퍼링 중 반복 seek 방지)

const YT_STATE = { UNSTARTED: -1, ENDED: 0, PLAYING: 1, PAUSED: 2, BUFFERING: 3, CUED: 5 };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const $ = (s, r = document) => r.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

/**
 * 동기화 모델
 *  각 방송 i 는 "실제 시각" 축 위의 시작점 start_i(초, epoch)를 가진다.
 *  공통 타임라인 G(= 실제 시각) 에서 방송 i 가 있어야 할 위치:
 *      pos_i = G - start_i + manual_i
 *  manual_i > 0 이면 그 방송을 앞쪽(나중 장면)으로 당긴다.
 *  G 는 기준(master) 방송의 현재 위치로부터 역산한다.
 */
const streams = [];      // { id, start, manual, player, ready, tile, title, lastSeek, muted, vol, waiting }
let masterIdx = 0;
let selIdx = 0;          // 하단 도크가 제어하는 방송
let playing = false;     // 사용자가 의도한 전체 재생 상태
let syncTimer = null;
let seekDragging = false;

if (isIOS) { $('#iosNotice').classList.remove('hidden'); $('#volRow').classList.add('hidden'); }
$('#apiKey').value = store.get('ytmv.apiKey') || '';

// ---- URL 파싱 ----
function parseVideoId(s) {
  s = s.trim();
  if (!s) return null;
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s);
    if (u.hostname.endsWith('youtu.be')) return u.pathname.slice(1, 12) || null;
    if (u.searchParams.get('v')) return u.searchParams.get('v');
    const m = u.pathname.match(/\/(?:live|embed|shorts|v)\/([\w-]{11})/);
    return m ? m[1] : null;
  } catch { return null; }
}

// ---- 공유 링크(#v=id1,id2&o=0,1.5&m=0) ----
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const ids = (p.get('v') || '').split(',').filter(Boolean);
  if (!ids.length) return;
  $('#urls').value = ids.join('\n');
  const offs = (p.get('o') || '').split(',').map(Number);
  return { ids, offs, master: Number(p.get('m')) || 0 };
}
function writeHash() {
  const v = streams.map(s => s.id).join(',');
  const o = streams.map(s => +s.manual.toFixed(2)).join(',');
  history.replaceState(null, '', `#v=${v}&o=${o}&m=${masterIdx}`);
}

// ---- 방송 시작시각 조회 (YouTube Data API v3) ----
async function fetchStartTimes(ids, key) {
  const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${ids.join(',')}&key=${encodeURIComponent(key)}`;
  const res = await fetch(url);
  const json = await res.json();
  if (!res.ok) throw new Error(json.error?.message || res.status);
  const map = {};
  for (const item of json.items || []) {
    const d = item.liveStreamingDetails || {};
    const t = d.actualStartTime || d.scheduledStartTime;
    map[item.id] = { title: item.snippet?.title, start: t ? Date.parse(t) / 1000 : null };
  }
  return map;
}

// ---- IFrame API 로드 ----
const ytReady = new Promise(resolve => { window.onYouTubeIframeAPIReady = resolve; });
function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (!document.getElementById('yt-api')) {
    const s = document.createElement('script');
    s.id = 'yt-api';
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
  return ytReady;
}

// ---- 설정 패널 ----
$('#loadBtn').onclick = () => setup();
$('#openSetup').onclick = () => $('#setup').classList.remove('hidden');
$('#closeSetup').onclick = () => $('#setup').classList.add('hidden');

async function setup(initial) {
  const ids = $('#urls').value.split('\n').map(parseVideoId).filter(Boolean);
  const msg = $('#setupMsg');
  msg.textContent = '';
  if (ids.length < 1 || ids.length > 4) { msg.textContent = '1~4개의 유효한 URL/ID를 입력하세요.'; return; }

  const key = $('#apiKey').value.trim();
  store.set('ytmv.apiKey', key);
  let meta = {}, apiFailed = false;
  if (key) {
    msg.textContent = '방송 시작시각 조회 중…';
    try { meta = await fetchStartTimes(ids, key); }
    catch (e) { apiFailed = true; msg.textContent = `API 조회 실패(${e.message}) — 수동 보정으로 진행합니다.`; }
  }

  teardown();
  const offs = initial?.offs || [];
  masterIdx = Math.min(initial?.master || 0, ids.length - 1);
  selIdx = masterIdx;
  ids.forEach((id, i) => {
    const m = meta[id] || {};
    streams.push({ id, start: m.start ?? 0, hasStart: m.start != null, manual: Number.isFinite(offs[i]) ? offs[i] : 0,
                   title: m.title || id, player: null, ready: false, lastSeek: 0, muted: false, vol: 100, tile: null });
  });
  const missing = streams.filter(s => !s.hasStart).length;
  if (key && missing && missing < streams.length) {
    // 일부만 시작시각이 있으면 없는 것은 기준 방송과 같은 시각으로 가정
    const ref = streams.find(s => s.hasStart).start;
    streams.forEach(s => { if (!s.hasStart) s.start = ref; });
  }
  if (!apiFailed) {
    msg.textContent = key ? (missing ? `${missing}개 방송은 시작시각 정보가 없어 수동 보정이 필요합니다.` : '시작시각 기준 자동 싱크 적용됨.')
                          : 'API 키 없음 — 수동 보정으로 싱크를 맞추세요.';
  }

  await loadYT();
  document.body.classList.add('loaded');
  $('#stage').classList.remove('hidden');
  $('#dock').classList.remove('hidden');
  $('#closeSetup').classList.remove('hidden');
  // 오류 메시지가 없으면 설정 패널을 닫고 영상 화면으로
  if (!apiFailed && !(key && missing)) $('#setup').classList.add('hidden');

  streams.forEach((s, i) => buildTile(s, i));
  fitLayout();
  renderSelection();
  writeHash();
}

function teardown() {
  clearInterval(syncTimer); syncTimer = null;
  playing = false;
  renderPlayBtn();
  streams.forEach(s => { try { s.player?.destroy(); } catch {} });
  streams.length = 0;
  $('#grid').innerHTML = '';
}

function buildTile(s, i) {
  const tile = $('#tileTpl').content.firstElementChild.cloneNode(true);
  s.tile = tile;
  $('#grid').appendChild(tile);
  $('.num', tile).textContent = i + 1;
  $('.name', tile).textContent = s.title;
  $('.label', tile).onclick = () => { selIdx = i; renderSelection(); };

  s.player = new YT.Player($('.player', tile), {
    videoId: s.id,
    playerVars: { playsinline: 1, rel: 0, controls: 1, origin: location.origin },
    events: {
      onReady: () => { s.ready = true; if (streams.every(x => x.ready)) onAllReady(); },
      onStateChange: e => onStateChange(s, e.data),
      onError: e => { $('.st', tile).textContent = `오류 ${e.data}`; $('.st', tile).title = '임베드 금지/비공개 영상일 수 있음'; },
    },
  });
}

function onAllReady() {
  // 정렬은 첫 재생 시점에 수행 (cued 상태에서 seekTo 하면 자동재생이 시도되므로)
  syncTimer = setInterval(tick, SYNC_INTERVAL_MS);
}

// ---- 레이아웃: 화면 크기와 방송 수로 열 수를 골라 영상이 가장 크게 보이도록 ----
function fitLayout() {
  const n = streams.length;
  if (!n) return;
  const stage = $('#stage');
  const cs = getComputedStyle(document.documentElement);
  const gap = parseFloat(cs.getPropertyValue('--gap'));
  const labelH = parseFloat(cs.getPropertyValue('--label-h'));
  const W = stage.clientWidth - 2 * gap, H = stage.clientHeight - 2 * gap;
  let best = { w: 0, cols: 1 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const cellW = (W - (cols - 1) * gap) / cols;
    const cellVideoH = (H - (rows - 1) * gap) / rows - labelH;
    const w = Math.floor(Math.min(cellW, cellVideoH * 16 / 9));
    if (w >= best.w * 0.97) best = { w, cols };   // 거의 같으면 열이 많은 격자를 선호
  }
  // 화면이 너무 낮으면(키보드 등) 최소 크기 유지 후 스크롤
  const w = Math.max(best.w, Math.min(160, W));
  $('#grid').style.gridTemplateColumns = `repeat(${best.cols}, ${w}px)`;
}
new ResizeObserver(fitLayout).observe($('#stage'));

// ---- 선택한 방송 제어(하단 도크) ----
const sel = () => streams[selIdx];

function renderSelection() {
  streams.forEach((s, i) => {
    s.tile.classList.toggle('sel', i === selIdx);
    $('.star', s.tile).classList.toggle('hidden', i !== masterIdx);
  });
  const s = sel();
  if (!s) return;
  $('#selNum').textContent = selIdx + 1;
  $('#masterBtn').classList.toggle('on', selIdx === masterIdx);
  $('#muteBtn').textContent = s.muted ? '🔇' : '🔊';
  $('#manual').value = s.manual;
  $('#vol').value = s.vol;
  $('#volVal').textContent = s.vol;
}

$('#masterBtn').onclick = () => { masterIdx = selIdx; renderSelection(); writeHash(); };
$('#muteBtn').onclick = () => { setMuted(sel(), !sel().muted); renderSelection(); };
$('#soloBtn').onclick = () => { streams.forEach(o => setMuted(o, o !== sel())); renderSelection(); };
$('#vol').oninput = e => {
  const s = sel();
  s.vol = +e.target.value;
  $('#volVal').textContent = s.vol;
  if (s.ready) s.player.setVolume(s.vol);
};
$('#manual').onchange = e => { sel().manual = +e.target.value || 0; afterManualChange(); };
document.querySelectorAll('[data-nudge]').forEach(b => b.onclick = () => {
  const s = sel();
  s.manual = Math.round((s.manual + +b.dataset.nudge) * 100) / 100;
  $('#manual').value = s.manual;
  afterManualChange();
});

function setMuted(s, muted) {
  s.muted = muted;
  if (s.ready) muted ? s.player.mute() : s.player.unMute();
}

function afterManualChange() { writeHash(); alignAll(currentG(), false); }

// ---- 타임라인 계산 ----
const master = () => streams[masterIdx];
const timelineAt = (s, pos) => pos + s.start - s.manual;          // 위치 -> G
const targetPos  = (s, G)   => G - s.start + s.manual;            // G -> 위치
const currentG   = () => timelineAt(master(), master().player.getCurrentTime() || 0);
const duration   = s => s.player.getDuration() || 0;

// 한 방송을 G 에 맞춰 이동. 아직 시작 전(pos<0)이면 0초에서 대기, 끝났으면 정지.
function place(s, G, shouldPlay) {
  const pos = targetPos(s, G);
  const dur = duration(s);
  s.lastSeek = performance.now();
  if (pos < 0 || (dur && pos >= dur)) {
    s.player.seekTo(pos < 0 ? 0 : dur, true);
    s.player.pauseVideo();
    s.waiting = pos < 0;
    return;
  }
  s.waiting = false;
  s.player.seekTo(pos, true);
  if (shouldPlay) s.player.playVideo(); else s.player.pauseVideo();
}

// includeMaster=false: G 를 기준 방송 현재 위치에서 구했을 때 기준 방송은 다시 seek 하지 않음
function alignAll(G, includeMaster = true) {
  streams.forEach(s => s.ready && (includeMaster || s !== master()) && place(s, G, playing));
}

// ---- 전체 제어 ----
function renderPlayBtn() { $('#playPause').textContent = playing ? '⏸' : '▶'; }

// iOS: playVideo 호출은 반드시 사용자 탭 핸들러 안에서 동기적으로 이뤄져야 함
function playAll() {
  playing = true;
  const G = currentG();
  streams.forEach(s => {
    const pos = targetPos(s, G);
    if (pos >= 0 && pos < (duration(s) || Infinity)) s.player.playVideo();
  });
  alignAll(G, false);
  renderPlayBtn();
}
function pauseAll() {
  playing = false;
  streams.forEach(s => s.player.pauseVideo());
  renderPlayBtn();
}
$('#playPause').onclick = () => { if (streams.every(s => s.ready)) playing ? pauseAll() : playAll(); };
$('#resync').onclick = () => alignAll(currentG(), false);
document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => alignAll(currentG() + +b.dataset.jump));

const seek = $('#seek');
seek.oninput = () => { seekDragging = true; renderClock(+seek.value); };
seek.onchange = () => { seekDragging = false; alignAll(timelineAt(master(), +seek.value)); };

$('#shareBtn').onclick = async () => {
  writeHash();
  try { await navigator.clipboard.writeText(location.href); $('#shareBtn').textContent = '✓'; }
  catch { prompt('링크', location.href); }
  setTimeout(() => $('#shareBtn').textContent = '🔗', 1500);
};

// 기준 방송을 자체 컨트롤로 재생/정지하면 전체에 반영
function onStateChange(s, state) {
  if (s !== master()) return;
  if (state === YT_STATE.PLAYING && !playing) {
    playing = true; alignAll(currentG(), false); renderPlayBtn();
  } else if (state === YT_STATE.PAUSED && playing) {
    playing = false; streams.forEach(o => o !== s && o.player.pauseVideo()); renderPlayBtn();
  }
}

// ---- 드리프트 보정 루프 ----
function tick() {
  if (!streams.length || !master().ready) return;
  const m = master();
  const G = currentG();
  const now = performance.now();
  const masterRunning = m.player.getPlayerState() === YT_STATE.PLAYING;

  streams.forEach(s => {
    if (!s.ready) return;
    const want = targetPos(s, G);
    const cur = s.player.getCurrentTime() || 0;
    const drift = cur - want;
    const st = s.player.getPlayerState();
    const man = s.manual ? `보정${s.manual > 0 ? '+' : ''}${s.manual} ` : '';
    const d = s === m ? '' : s.waiting ? '대기' :
      `<span class="${Math.abs(drift) < DRIFT_SEEK_SEC ? 'ok' : 'bad'}">${drift >= 0 ? '+' : ''}${drift.toFixed(2)}</span>`;
    $('.st', s.tile).innerHTML = (s.muted ? '🔇 ' : '') + man + d;

    if (s === m || !playing || !masterRunning) return;
    if (now - s.lastSeek < SEEK_COOLDOWN_MS) return;
    // 늦게 시작하는 방송: 목표 위치가 0 이상이 되면 재생 시작
    if (s.waiting && want >= 0) { place(s, G, true); return; }
    if (want < 0 || s.waiting) return;
    if (duration(s) && want >= duration(s)) {           // 이 방송은 이미 끝난 구간
      if (st === YT_STATE.PLAYING) s.player.pauseVideo();
      return;
    }
    if (Math.abs(drift) > DRIFT_SEEK_SEC || st !== YT_STATE.PLAYING && st !== YT_STATE.BUFFERING) {
      place(s, G, true);
    }
  });

  if (!seekDragging) {
    seek.max = Math.floor(duration(m));
    seek.value = Math.floor(m.player.getCurrentTime() || 0);
    renderClock(+seek.value);
  }
}

function renderClock(pos) { $('#clock').textContent = `${fmt(pos)} / ${fmt(duration(master()))}`; }
function fmt(t) {
  t = Math.max(0, Math.floor(t));
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

const initial = readHash();
if (initial) setup(initial);
</script>
</body>
